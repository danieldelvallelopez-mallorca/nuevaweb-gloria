name: php-lint

# Comprueba la sintaxis de la API del concierge antes de subirla a Hostinger.
on:
  push:
    paths: ["api/**", ".github/workflows/php-lint.yml"]
  pull_request:
    paths: ["api/**", ".github/workflows/php-lint.yml"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: php -l
        run: |
          php --version | head -1
          find api -name '*.php' -print0 | xargs -0 -n1 php -l
